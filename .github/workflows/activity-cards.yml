name: Refresh Self-Hosted Activity Cards
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity-cards.yml"
      - "scripts/update_activity.py"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py
      - name: Commit SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub activity cards"
            git push
          fi
